name: Secret scan

# Backstop layer. The pre-commit hook runs on a developer's machine and can be
# bypassed with --no-verify or skipped on a fresh clone; this cannot.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 3 * * 1'   # weekly sweep, catches rules added after a commit landed

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # full history — a secret in an old commit still counts

      - name: Scan repository
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
